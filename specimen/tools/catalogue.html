<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type-Remix · Juanemo</title>
<meta name="description" content="A personal type library of open-source fonts, remixed with more personality and character.">
<style>
/* Layout idea: a landing page for the library. Name, intro, the fonts set in themselves, the open-source credits, and the Juanemo footer.
   The page itself is set in one quiet sans (Instrument Sans) so the library's fonts carry the character. Generated by tools/build_specimen.py from catalog.json + site.json. */
:root{--vw:min(1vw,14.4px);--paper:#fbfbf9;--ink:#1d1d1f;--dark:#3d3d40;--mid:#86868b;--light:#e4e4e1;--gut:clamp(18px,calc(3.4*var(--vw)),56px);color-scheme:light}
/* page font: Instrument Sans (Google Fonts, SIL OFL 1.1), hosted alongside the page */
@font-face{font-family:'IS';src:url('assets/InstrumentSans.woff2') format('woff2');font-weight:400 700;font-stretch:75% 100%;font-display:swap}
@font-face{font-family:'IS';src:url('assets/InstrumentSans-Italic.woff2') format('woff2');font-weight:400 700;font-stretch:75% 100%;font-style:italic;font-display:swap}
*{box-sizing:border-box}
html{margin:0;background:var(--paper);color:var(--ink)}
body{margin:0;background:transparent;color:var(--ink)}
body .jf{background:transparent}
body{font-family:'IS',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
.lbl{font-family:'IS',system-ui,sans-serif;font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mid)}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--gut)}


/* hero */
.hero{padding:clamp(28px,calc(5*var(--vw)),72px) 0 0}
.hero h1 span{display:inline-block}
.hero h1{margin:0;font-weight:500;line-height:.9;letter-spacing:-.055em;white-space:nowrap;font-size:calc(18*var(--vw))}
.lede{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:clamp(24px,calc(5*var(--vw)),96px);margin-top:clamp(20px,calc(3*var(--vw)),40px);padding:clamp(22px,calc(3*var(--vw)),40px) 0 clamp(48px,calc(7*var(--vw)),110px)}
.intro p{margin:0 0 .8em;font-size:clamp(19px,calc(1.7*var(--vw)),24px);line-height:1.45;letter-spacing:-.01em;max-width:34em;color:var(--ink)}
.intro p:last-child{margin:0}
.intro .part{font-size:16px;color:var(--mid);margin-top:1.4em}
.intro .part a{color:var(--ink)}

/* section heads */
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;border-top:1px solid var(--ink);padding-top:16px}
.sh h2{margin:0;font-weight:500;font-size:clamp(26px,calc(3*var(--vw)),42px);line-height:1;letter-spacing:-.035em}

/* the fonts */
ol.fonts{list-style:none;margin:clamp(18px,calc(2.4*var(--vw)),32px) 0 0;padding:0}
ol.fonts li{border-top:1px solid var(--light)}
ol.fonts li:last-child{border-bottom:1px solid var(--light)}
a.font{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,.42fr);grid-template-areas:'no no' 'nm info';gap:12px var(--gut);align-items:end;padding:clamp(18px,calc(2.4*var(--vw)),34px) 0;color:inherit;text-decoration:none}
a.font:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.no{grid-area:no;margin-bottom:-.2em}
.nm{grid-area:nm;font-size:clamp(56px,calc(10*var(--vw)),180px);line-height:.88;letter-spacing:-.03em;white-space:nowrap;overflow:hidden}
.info{grid-area:info;display:flex;flex-direction:column;gap:6px;font-size:15px;padding-bottom:.5em}
.info .t{font-size:18px;line-height:1.3;font-weight:500;letter-spacing:-.01em;color:var(--ink)}
.info .m{color:var(--mid)}
.go{font-family:'IS',system-ui,sans-serif;font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px}
a.font:hover .go{text-decoration:underline;text-underline-offset:3px}

/* open source */
.open{padding:clamp(64px,calc(9*var(--vw)),140px) 0 0}
.opengrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,calc(5*var(--vw)),96px);margin-top:clamp(20px,calc(3*var(--vw)),36px)}
.opengrid p{margin:0 0 1em;max-width:36em}
.cando{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:1.4em 0}
.cando ul{margin:10px 0 0;padding:0;list-style:none}
.cando li{margin:.5em 0;display:flex;gap:10px;align-items:flex-start}
.cando .fa{flex:none;width:.85em;height:.85em;margin-top:.33em;color:#15a85b}  /* green and red picked to sit with the specimens' pink and yellow */
.cando .no .fa{color:#f0443a}
body{overflow-x:clip}
/* originals: a stack of cards, each set a little down and to the right of the one before. The front card always sits
   upper left; each shuffle tucks it under the back of the stack and the rest move up a place, working through the list */
.oc{--off:26px;--span:calc(var(--off)*2);max-width:calc(416px + var(--span));margin-left:auto;width:100%}
.oc-view{position:relative;outline:none}
.oc-view:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.oc-track{position:relative;touch-action:pan-y;user-select:none;padding-bottom:calc((100% - var(--span))*1.25 + var(--span))}
.ocard{position:absolute;left:calc(var(--k)*var(--off));top:calc(var(--k)*var(--off));width:calc(100% - var(--span));aspect-ratio:4/5;padding:21px 21px 18px;display:flex;flex-direction:column;gap:12px;min-width:0;
  background:#101010 url('assets/paper-black-news.jpg') repeat 0 0/627px 627px;color:#f4f4f1;border:1px solid rgba(255,255,255,.28);box-shadow:0 14px 34px rgba(0,0,0,.22);cursor:pointer;overflow:hidden;transition:left .45s cubic-bezier(.34,1.56,.64,1),top .45s cubic-bezier(.34,1.56,.64,1)}
.ocard::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 110% 100% at 50% 45%,transparent 50%,rgba(0,0,0,.3) 82%,rgba(0,0,0,.5) 100%)}
.ocard>*{position:relative;z-index:1;transition:opacity .35s ease}
.ocard::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;background:#000;opacity:0;transition:opacity .25s ease}
.ocard:not(.is)::before{opacity:.42}  /* cards out of focus sit darker, including the one on its way out */
.ocard:not(.is)>*{opacity:0;transition-delay:.34s}  /* the old card keeps its text until it has tucked behind the stack */
.ocard.is{cursor:default}
.ocard .big{font-size:clamp(96px,calc(11.2*var(--vw)),160px);line-height:.9;color:#f4f4f1;margin:auto 0 0;letter-spacing:-.02em}
.ocard .on{font-size:clamp(27px,calc(2.9*var(--vw)),42px);line-height:1;color:#f4f4f1;letter-spacing:-.01em}
.ocard .d{font-size:14px;color:#c9c9c5;margin:0}
.ocard .d span{display:block;color:#8a8a86;font-size:13px;margin-top:4px}
.ocard .lk{margin-top:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:'IS',system-ui,sans-serif;font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.ocard .lk a{text-decoration:none;color:#f4f4f1}.ocard .lk a:hover{text-decoration:underline}
.oc-dots{display:flex;gap:8px;justify-content:center;margin-top:20px}
.oc-dots button{width:8px;height:8px;border-radius:999px;border:0;padding:0;background:var(--light);cursor:pointer;transition:width .4s,background .4s}
.oc-dots button[aria-current=true]{width:24px;background:var(--ink)}

.credit{border-top:1px solid var(--light);padding:16px 0;display:grid;grid-template-columns:minmax(120px,.7fr) minmax(0,1.3fr);gap:6px 18px}
.credit:first-child{border-top:1px solid var(--light)}
.credit .f{font-size:22px;line-height:1.1;color:var(--ink)}
.credit .d{font-size:15px;color:var(--dark)}
.credit .d span{display:block;color:var(--mid);font-size:14px}
.tm{font-size:14px;color:var(--mid);margin-top:14px}


@media (max-width:860px){
  .lede,.opengrid{grid-template-columns:1fr}
  .lede>div[aria-hidden]{display:none}
  a.font{grid-template-columns:1fr;grid-template-areas:'no' 'nm' 'info'}
  }
@media (max-width:520px){.cando{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero" aria-labelledby="title">
    <h1 id="title"></h1>
    <div class="lede">
      <div aria-hidden="true"></div>
      <div class="intro" id="intro"></div>
    </div>
  </section>

  <section aria-labelledby="fontsH">
    <div class="sh"><h2 id="fontsH">The remixes</h2><span class="lbl">Open one to try it</span></div>
    <ol class="fonts" id="list"></ol>
  </section>

  <section class="open" id="open" aria-labelledby="openH">
    <div class="sh"><h2 id="openH">The originals</h2><span class="lbl" id="licTag"></span></div>
    <div class="opengrid">
      <div id="openText"></div>
      <div class="oc" id="oc" role="region" aria-roledescription="carousel" aria-label="The original fonts"><div class="oc-view" id="ocView" tabindex="0"><div class="oc-track" id="credits"></div></div><div class="oc-dots" id="ocDots"></div></div>
    </div>
  </section>
</main>


<script>
const CAT=/*CATALOG*/[];
const SITE=/*SITE*/{};
const $=id=>document.getElementById(id);
const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const NUM=['No','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve'];
const n=CAT.length, nWord=NUM[n]||String(n);
const title=SITE.title||'Type Library';document.title=`${title} · Juanemo`;const P=SITE.parent||{}, L=SITE.license||{name:'SIL Open Font License 1.1',url:'https://openfontlicense.org/'}, A=SITE.about||{};

/* bar + hero */
/* links to the parent site are off until site.json says "link": true */
const pLink=P.url&&P.link===true, pName=pLink?`<a href="${esc(P.url)}">${esc(P.name)}</a>`:esc(P.name||'');
$('title').innerHTML=`<span>${esc(title)}</span>`;
const fit=()=>{const h=$('title'),sp=h.firstChild,w=h.clientWidth;h.style.fontSize='100px';h.style.fontSize=(100*w/sp.getBoundingClientRect().width*.995)+'px'};
document.fonts.ready.then(fit);addEventListener('resize',fit);fit();
$('intro').innerHTML=(SITE.intro||[]).map(p=>`<p>${esc(p)}</p>`).join('');

/* the fonts, each set in itself */
const st=document.createElement('style');document.head.appendChild(st);
CAT.forEach((f,i)=>{st.sheet.insertRule(`@font-face{font-family:'cat${i}';src:url('${f.slug}/font.woff2') format('woff2');font-weight:1 1000;font-display:swap}`);
  const disp=f.display||Object.fromEntries(f.axes.map(a=>[a.tag,a.tag==='wght'?Math.min(700,a.max):a.max]));
  const fv=f.axes.map(a=>`'${a.tag}' ${disp[a.tag]??a.default}`).join(', ')||'normal';
  const ax=f.axes.map(a=>`${esc(a.name||a.tag)} ${+a.min.toFixed(1)}–${+a.max.toFixed(1)}`).join(' · ');
  const li=document.createElement('li');
  li.innerHTML=`<a class="font" href="${f.slug}/index.html"><div class="no lbl">${String(i+1).padStart(2,'0')}</div><div class="nm" style="font-family:'cat${i}',Georgia,serif;font-variation-settings:${fv}">${esc(f.name)}</div>
    <div class="info"><span class="t">${esc(f.tagline||'')}</span><span class="m">${f.base&&f.base.name?`Original: ${esc(f.base.name)}`:''}${f.remix&&f.remix.ingredient?` · Added: ${esc(f.remix.ingredient.toLowerCase())}`:''}<br>${ax||'Static'}${f.italic?' · with italic':''} · ${f.glyphs} characters</span><span class="go">Open specimen →</span></div></a>`;
  $('list').appendChild(li)});

/* open source */
$('licTag').textContent=L.name;
$('openText').innerHTML=`<p>Every remix credits its original. Each original was released under the ${esc(L.name)}, and each remix is released under that same license. In short: they’re free.</p>
 <div class="cando"><div><span class="lbl">You can</span><ul><li><svg class="fa" viewBox="0 0 448 512" aria-hidden="true"><path fill="currentColor" d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg>Use them for personal and commercial work</li><li><svg class="fa" viewBox="0 0 448 512" aria-hidden="true"><path fill="currentColor" d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg>Embed them in websites, apps, documents and products</li><li><svg class="fa" viewBox="0 0 448 512" aria-hidden="true"><path fill="currentColor" d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg>Share them, and modify them further</li></ul></div>
 <div><span class="lbl">You can’t</span><ul class="no"><li><svg class="fa" viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>Sell the fonts on their own</li><li><svg class="fa" viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>Release a modified version under a different license</li><li><svg class="fa" viewBox="0 0 384 512" aria-hidden="true"><path fill="currentColor" d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z"/></svg>Use an original font’s Reserved Font Name for a modified version</li></ul></div></div>
 <p>Each download includes the license and the original copyright notices. This is a summary, not legal advice: the <a href="${esc(L.url)}" target="_blank" rel="noopener">full license</a> is short and readable.</p>`;
/* the originals, as a carousel of cards set in each original font (Font Awesome Free icons above, CC BY 4.0) */
CAT.forEach((f,i)=>st.sheet.insertRule(`@font-face{font-family:'orig${i}';src:url('assets/originals/${f.slug}.ttf') format('truetype');font-weight:1 1000;font-display:swap}`));
$('credits').innerHTML=CAT.map((f,i)=>{const b=f.base||{};return `<article class="ocard" style="--k:${i}" role="group" aria-roledescription="slide" aria-label="${i+1} of ${CAT.length}: ${esc(b.name||'')}">
  <div class="on" style="font-family:'orig${i}',system-ui,sans-serif">${esc(b.name||'')}</div>
  <div class="big" style="font-family:'orig${i}',system-ui,sans-serif" aria-hidden="true">Aa</div>
  <p class="d">By ${esc(b.by||'its authors')}.<span>${esc(b.copyright||'')}</span></p>
  <div class="lk">${b.url?`<a href="${esc(b.url)}" target="_blank" rel="noopener">Get the original ↗</a>`:''}<a href="${f.slug}/index.html">See the remix: ${esc(f.name)} →</a></div></article>`}).join('');
{const view=$('ocView'),track=$('credits'),cards=[...track.children],dots=$('ocDots'),n=cards.length,still=matchMedia('(prefers-reduced-motion: reduce)').matches;let idx=0,timer=null,hold=false;
  dots.innerHTML=cards.map((c,i)=>`<button type="button" aria-label="Show ${esc((CAT[i].base||{}).name||'')}"></button>`).join('');const db=[...dots.children];
  /* the shuffle: cards keep their order in the list; whichever card is current takes the front slot (upper left)
     and the rest follow it in list order, so the old front card tucks under to the back */
  view.parentElement.style.setProperty('--span',`calc(var(--off)*${Math.max(0,n-1)})`);
  /* like shuffling a deck: the old front card is pulled up and out to the left with a twist, then tucked under the back;
     the new front card rocks into place with a slight rotation */
  const go=(i,anim=true)=>{const prev=idx;idx=(i+n)%n;const move=anim&&!still&&prev!==idx&&!!cards[prev].animate;
    cards.forEach((el,k)=>{const slot=(k-idx+n)%n;
      if(!anim||still)el.style.transition='none';el.style.setProperty('--k',slot);el.style.zIndex=(move&&k===prev)?n+1:n-slot;
      el.classList.toggle('is',k===idx);el.setAttribute('aria-hidden',k!==idx);if(!anim||still){el.offsetWidth;el.style.transition=''}});
    if(move){const out=cards[prev],inn=cards[idx];out.style.transitionDelay='.24s';setTimeout(()=>out.style.transitionDelay='',800);
      out.animate([{transform:'none'},{transform:'translate(-42%,-22%) rotate(-7deg)',offset:.42},{transform:'none'}],{duration:620,easing:'cubic-bezier(.4,0,.2,1)'});
      setTimeout(()=>{out.style.zIndex=n-(prev-idx+n)%n},260);
      inn.animate([{transform:'rotate(3.5deg)'},{transform:'rotate(-1.2deg)',offset:.65},{transform:'none'}],{duration:520,easing:'cubic-bezier(.3,.7,.3,1)'})}
    db.forEach((d,k)=>d.setAttribute('aria-current',k===idx))};
  cards.forEach((el,k)=>el.addEventListener('click',()=>{if(k!==idx){go(k);play()}}));
  const play=()=>{clearInterval(timer);if(!still&&n>1)timer=setInterval(()=>{if(!hold&&!document.hidden)go(idx+1)},7000)};
  db.forEach((d,k)=>d.onclick=()=>{if(k!==idx)go(k);play()});
  view.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){go(idx+1);play()}if(e.key==='ArrowLeft'){go(idx-1);play()}});
  [view,dots].forEach(el=>{el.addEventListener('pointerenter',()=>hold=true);el.addEventListener('pointerleave',()=>hold=false);el.addEventListener('focusin',()=>hold=true);el.addEventListener('focusout',()=>hold=false)});
  let x0=null;view.addEventListener('pointerdown',e=>{x0=e.clientX});view.addEventListener('pointerup',e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)>40){go(idx+(dx<0?1:-1));play()}});
  go(0,false);play()}

window.JF={site:SITE,cat:CAT,base:'',paper:'page'};
</script>
<!--FOOTER-->
<script>/* the first click anywhere on the home page counts as permission for sound on the specimen pages this visit */
['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,()=>{try{sessionStorage.setItem('tr-heard','1')}catch(e){}},{once:true,passive:true}));</script>
</body>
</html>
