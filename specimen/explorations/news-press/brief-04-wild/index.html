<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News Press Specimen</title>
<style>
/* Layout idea: a black-and-white masthead where the name cycles through the font's axes, then full-bleed proof sections with riso inks on white. Every section is filled from the font's own data. */
:root{
  --paper:#ffffff; --ink:#111111; --muted:#76766f; --rule:#e2e2dd; --tint:#f4f4f0;
  --pink:#ff48b0; --blue:#0078bf; --yellow:#ffe800;
  --vw:min(1vw,14.4px);--g:clamp(18px,calc(3.4*var(--vw)),56px);--gut:calc(max(0px,(100vw - 1440px)/2) + var(--g));
  --display:'Specimen Font',system-ui,sans-serif;
  --ui:'IS',system-ui,-apple-system,sans-serif;
  --fv-ui:normal; --fv-display:normal;
  color-scheme:light;
}
/* UI font: Instrument Sans (SIL OFL 1.1), shared with the home page; the specimen font is kept for the name, titles and samples */
@font-face{font-family:'IS';src:url('../../../assets/InstrumentSans.woff2') format('woff2');font-weight:400 700;font-stretch:75% 100%;font-display:swap}
@font-face{font-family:'Specimen Font';src:url('font.woff2') format('woff2');font-weight:1 1000;font-style:normal;font-display:block}
@font-face{font-family:'Specimen Font';src:url('font-italic.woff2') format('woff2');font-weight:1 1000;font-style:italic;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:var(--display);font-variation-settings:var(--fv-ui);line-height:1.45;overflow-x:hidden}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.btn{font:inherit;font-size:13px;font-weight:600;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:9px 15px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
section{padding:clamp(48px,calc(7*var(--vw)),110px) var(--gut)}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,26rem);gap:var(--g);align-items:end;margin-bottom:clamp(24px,calc(3.4*var(--vw)),48px)}
.head h2{font-size:clamp(34px,calc(5.4*var(--vw)),88px);line-height:.95;margin:0;font-weight:700;font-variation-settings:var(--fv-display);letter-spacing:-.02em;text-wrap:balance}
.head p{margin:0;color:var(--muted);max-width:26rem;justify-self:end;font-size:14px;line-height:1.55}
.num,.axt{display:none}
/* back to the library: same pill as Get the font, mirrored to the top left */
.getbtn.back{left:var(--gut);right:auto}
.getbtn.snd{display:flex;align-items:center;justify-content:center;padding:0;width:var(--sndw,40px);height:var(--sndw,40px)}
.getbtn.snd .x{display:none}.getbtn.snd[aria-pressed=false] .x{display:inline}.getbtn.snd[aria-pressed=false] .w{display:none}

.getbtn{position:fixed;top:clamp(10px,calc(1.6*var(--vw)),22px);right:var(--gut);z-index:60;font:600 13px/1 var(--display);font-variation-settings:var(--fv-ui);letter-spacing:.02em;
  padding:11px 16px;border-radius:999px;border:2px solid var(--ink);color:var(--ink);background:transparent;text-decoration:none;
  transition:background .25s ease,color .25s ease,box-shadow .25s ease}
.getbtn.on{background:var(--ink);color:var(--paper);box-shadow:0 0 0 1px rgba(255,255,255,.35),0 6px 18px rgba(0,0,0,.18)}
.getbtn:hover{background:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion:reduce){.getbtn{transition:none}}
@media (max-width:700px){.hmeta{min-height:40px}.hmeta>span{display:none}.hmeta>span:last-child{display:none}}

/* hero */
.hero{min-height:min(100svh,1100px);display:flex;flex-direction:column;padding:clamp(14px,calc(2*var(--vw)),28px) var(--gut) 76px;gap:clamp(18px,calc(2.4*var(--vw)),32px)}
.hmeta{display:flex;justify-content:space-between;gap:10px 28px;flex-wrap:wrap}.hmeta a{color:inherit}
.hstage{flex:1;display:flex;align-items:center;justify-content:center;min-height:clamp(140px,calc(22*var(--vw)),420px)}
.hname{margin:0;white-space:nowrap;line-height:.8;letter-spacing:var(--hero-track,0em);font-weight:700;width:max-content;position:relative}
.hname .kmeas{position:absolute;visibility:hidden;left:0;top:0;white-space:pre;letter-spacing:0}
.hname span{display:inline-block;transform-origin:50% 100%}
.hcap{margin:0;color:var(--muted);font-size:clamp(14px,calc(1.05*var(--vw)),16px);max-width:60ch}
.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px clamp(14px,calc(2*var(--vw)),32px);border-top:1px solid var(--ink);padding-top:14px;align-items:start}
.axc{display:flex;flex-direction:column;gap:4px}
.axc b{font-size:clamp(17px,calc(1.5*var(--vw)),22px);line-height:1.15;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.axc .d{display:none}
.axes.hasbrief{display:flex;flex-wrap:wrap}.axes.hasbrief>.axc{flex:1 1 140px}.axes.hasbrief>.axc.brief{flex:2.6 1 380px}
.axc.brief p{margin:0;font-size:14px;line-height:1.55;color:var(--ink);max-width:60ch}
.axc code{font-size:11px;text-transform:none;letter-spacing:0;font-family:ui-monospace,Menlo,monospace}

/* scroll test */
.scroll{height:250vh;position:relative;background:var(--ink);color:var(--paper);padding:0}
.stick{position:sticky;top:0;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:var(--g) var(--gut);overflow:hidden}
.inst{color:#cfcfca;max-width:52ch;margin:0 0 30px;font-size:clamp(15px,calc(1.15*var(--vw)),18px)}
#read{font-size:clamp(40px,calc(8.6*var(--vw)),180px);line-height:.98;letter-spacing:-.015em;max-width:15ch;text-wrap:balance}
.gauge{display:flex;gap:18px;margin-top:28px;color:#aaa;font-variant-numeric:tabular-nums;flex-wrap:wrap}.gauge b{color:var(--yellow)}
.prog{height:3px;background:#333;margin-top:10px;width:min(560px,100%)}.prog i{display:block;height:100%;background:var(--yellow);width:0}

/* loupe */
.loupe{background:var(--tint)}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) clamp(220px,calc(22*var(--vw)),340px);gap:var(--g);align-items:stretch}
.stage{position:relative;background:var(--paper);min-height:clamp(260px,calc(38*var(--vw)),620px);border:1px solid var(--rule)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.stage .set{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-start;padding-left:4%;white-space:nowrap;font-size:clamp(90px,calc(19*var(--vw)),380px);line-height:1}
.stage.drawn .set{visibility:hidden}.stage:not(.drawn) canvas{visibility:hidden}
.side{display:flex;flex-direction:column;gap:14px}
.pad{position:relative;aspect-ratio:1;background:var(--paper);border:2px solid var(--ink);cursor:crosshair;touch-action:none;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:25% 25%}
.pad.one{aspect-ratio:4/1}
.pad::before,.pad::after{content:"";position:absolute;background:var(--pink)}
.pad::before{left:0;right:0;height:1px;top:var(--py)}.pad::after{top:0;bottom:0;width:1px;left:var(--px)}
.pad .dot{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 3px var(--paper);z-index:1}
.pad .tip{position:absolute;left:50%;bottom:calc(100% + 9px);transform:translateX(-50%);background:var(--ink);color:#fff;font:600 11px/1 var(--ui);letter-spacing:.02em;white-space:nowrap;padding:6px 9px;border-radius:999px;pointer-events:none;animation:tipbob 1.6s ease-in-out infinite;transition:opacity .3s}
.pad .tip::after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--ink)}
.pad.lo .tip{bottom:auto;top:calc(100% + 9px)}.pad.lo .tip::after{top:auto;bottom:100%;border-top-color:transparent;border-bottom-color:var(--ink)}
.pad.used .tip{opacity:0;animation:none}
@keyframes tipbob{0%,100%{translate:0 0}50%{translate:0 -3px}}
@media (prefers-reduced-motion:reduce){.pad .tip{animation:none}}
.pad .ax{position:absolute;color:var(--muted);font-size:11px}
.read{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.read b{display:block;font-size:clamp(20px,calc(1.8*var(--vw)),28px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;color:var(--ink)}
.read div{color:var(--muted)}
.seg{display:flex}.seg button{flex:1}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}.seg button+button{border-left:0}

/* size */
.ladder .r{display:grid;grid-template-columns:clamp(70px,calc(8*var(--vw)),120px) minmax(0,1fr);gap:16px;align-items:baseline;border-top:1px solid var(--rule);padding:10px 0}
.ladder .r .t{white-space:nowrap;overflow:hidden}
.ladder .m{color:var(--muted);font-variant-numeric:tabular-nums}.ladder .m b{color:var(--pink)}

/* matrix */
.matrix{display:grid;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.matrix>div{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:clamp(28px,calc(6.2*var(--vw)),120px);line-height:1.2;padding:4px 0}
.matrix>.h{font-size:11px;color:var(--muted)}

/* italic */
.ital .rows{display:grid;gap:4px}
.ital .row{display:grid;grid-template-columns:clamp(70px,calc(8*var(--vw)),120px) minmax(0,1fr);gap:16px;align-items:baseline;border-top:1px solid var(--rule);padding:12px 0}
.ital .row .t{font-style:italic;font-size:clamp(34px,calc(6.4*var(--vw)),120px);line-height:1;white-space:nowrap;overflow:hidden}
.ital .row .m{color:var(--muted);font-variant-numeric:tabular-nums}

/* in use */
.uses{columns:4 300px;column-gap:clamp(12px,calc(1.6*var(--vw)),24px)}
.uses figure{break-inside:avoid;margin:0 0 clamp(12px,calc(1.6*var(--vw)),24px)}
.uses .frame{box-shadow:0 0 0 1px var(--rule)}
.uses figcaption,.prints figcaption{display:flex;flex-direction:column;gap:2px;padding:10px 2px 0;font-size:13px}
.uses figcaption span,.prints figcaption span{color:var(--muted)}

/* overprint */
.prints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,calc(1.6*var(--vw)),24px)}
.prints figure{margin:0}
.pf{container-type:inline-size;position:relative;aspect-ratio:4/5;background:#fffdf8;overflow:hidden;isolation:isolate;box-shadow:0 0 0 1px var(--rule)}
.pf span{position:absolute;white-space:nowrap;mix-blend-mode:multiply;line-height:.8;font-weight:700;letter-spacing:-.02em}

/* run */
.eds{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-left:1px solid var(--rule);border-top:1px solid var(--rule)}
.ed{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:clamp(10px,calc(1.2*var(--vw)),18px);display:flex;flex-direction:column;gap:6px;overflow:hidden}
.ed .w{font-size:clamp(36px,calc(5*var(--vw)),96px);line-height:1;font-weight:700;white-space:nowrap}
.ed .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}

/* features */
.feats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.f{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:18px;display:flex;flex-direction:column;gap:10px}
.f .s{font-size:clamp(26px,calc(2.6*var(--vw)),42px);line-height:1.1;font-variation-settings:var(--fv-display)}
.f .s.off{color:#b4b4ae}.hl{color:var(--pink)}

/* characters */
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(52px,calc(5*var(--vw)),84px),1fr));border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.gl span{font-weight:var(--wd,700);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,calc(2.8*var(--vw)),46px);font-variation-settings:var(--fv-display);transition:font-variation-settings .2s}
.gl span:hover{font-variation-settings:var(--fv-ui);background:var(--yellow)}
#get{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--g);padding:40px var(--gut) 0;border-top:1px solid var(--ink)}
#get p{margin:6px 0 0;color:#444;font-size:14px}
#get code{font-size:12px;background:var(--tint);padding:2px 5px;font-family:ui-monospace,Menlo,monospace}

/* labels, body copy, captions and buttons in the UI sans */
.small,.head p,.hcap,.axc,.btn,figcaption,#get,.pad .ax,.read,.ladder .m,.matrix>.h,.ital .row .m,.ed .n,.inst,.gauge{font-family:var(--ui);font-variation-settings:normal}
.back,.getbtn{font-family:var(--ui)!important;font-variation-settings:normal!important;font-weight:500!important}
@media (max-width:900px){
  .head,.lgrid,#get{grid-template-columns:1fr}
  .head p{justify-self:start}
  .prints{grid-template-columns:repeat(2,minmax(0,1fr))}
  .axes{grid-template-columns:repeat(2,minmax(0,1fr))}.axt{grid-column:1/-1}
  .eds{grid-template-columns:repeat(3,minmax(0,1fr))}
  .matrix .xw{display:none}
  .side{flex-direction:row;flex-wrap:wrap}.side .pad{width:min(100%,260px)}.side>div:not(.pad){flex:1 1 200px}
}
@media (max-width:560px){.prints{grid-template-columns:1fr}.hero{min-height:auto}}
@media (prefers-reduced-motion:reduce){.scroll{height:auto}.stick{position:static;min-height:0;padding:72px var(--gut)}.gl span{transition:none}}
</style>
</head>
<body>
<a class="getbtn back" id="backbtn" href="../../index.html">← Explorations</a>
<a class="getbtn" id="getbtn" href="#get">Get the font ↓</a>
<button class="getbtn snd" id="sndbtn" type="button" aria-pressed="true" aria-label="Sound on" title="Sound on"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M2 6h3l4-3v10l-4-3H2z" fill="currentColor"/><path class="w" d="M11 5.5a3.5 3.5 0 0 1 0 5M12.8 3.6a6 6 0 0 1 0 8.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path class="x" d="M11 6l4 4M15 6l-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
<header class="hero" aria-labelledby="hname">
  <div class="hmeta small"><span aria-hidden="true"></span><span id="htag">News Press-Remix</span><span aria-hidden="true"></span></div>
  <div class="hstage" id="hstage"><h1 class="hname" id="hname" aria-label="News Press">News Press</h1></div>
  <p class="hcap" id="hcap"></p>
  <div class="axes" id="hfacts"><div class="axt small">What's in the font</div></div>
</header>

<section class="scroll" id="scroll" aria-label="Scroll test" hidden>
  <div class="stick">    <p class="inst" id="sinst"></p>
    <div id="read"></div>
    <div class="gauge small" id="gauge"></div><div class="prog"><i id="sb"></i></div></div>
</section>

<section class="loupe" id="loupe" hidden>
  <div class="head"><div><span class="small num">Under the loupe</span><h2 id="lt"></h2></div><p id="lp"></p></div>
  <div class="lgrid">
    <div class="stage drawn" id="stage"><span class="set" id="set"></span><canvas id="cv" aria-label="Outline view of the word with its points"></canvas></div>
    <div class="side">
      <div class="pad" id="pad" role="slider" tabindex="0"><div class="dot"><span class="tip" aria-hidden="true">Drag me</span></div><span class="ax small" id="padx" style="right:6px;bottom:4px"></span><span class="ax small" id="pady" style="left:6px;top:4px"></span></div>
      <div class="read small" id="lread"></div>
      <div class="seg"><button class="btn" id="bSet" aria-pressed="false">As set</button><button class="btn" id="bDr" aria-pressed="true">As drawn</button></div>
    </div>
  </div>
</section>

<section id="size" hidden>
  <div class="head"><div><span class="small num">Size</span><h2 id="zt"></h2></div><p id="zp"></p></div>
  <div class="ladder" id="ladder"></div>
</section>

<section id="matrixS" style="background:var(--tint)" hidden>
  <div class="head"><div><span class="small num" id="mnum"></span><h2 id="mt"></h2></div><p id="mp"></p></div>
  <div class="matrix" id="matrix"></div>
</section>

<section class="ital" id="italS" hidden>
  <div class="head"><div><span class="small num">Italic</span><h2 id="it"></h2></div><p id="ip"></p></div>
  <div class="rows" id="irows"></div>
</section>

<section id="useS">
  <div class="head"><div><span class="small num">In use</span><h2 id="ut">Out in the world.</h2></div><p id="up"></p></div>
  <div class="uses" id="uses"></div>
</section>

<section id="printS" style="background:var(--tint)">
  <div class="head"><div><span class="small num" id="oe">Overprint</span><h2 id="ot">Ink over ink.</h2></div><p id="op"></p></div>
  <div class="prints" id="prints"></div>
  <div style="margin-top:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap"><button class="btn" id="repull">Pull a fresh set</button><span class="small" id="pset" style="color:var(--muted)"></span></div>
</section>

<section id="runS" hidden>
  <div class="head"><div><span class="small num">Print run</span><h2 id="rt">One to twelve.</h2></div><p id="rp"></p></div>
  <div class="eds" id="eds"></div>
</section>

<section id="featS" style="background:var(--tint)" hidden>
  <div class="head"><div><span class="small num">Features</span><h2 id="ft">Alternates and extras.</h2></div><p id="fp"></p></div>
  <div class="feats" id="feats"></div>
</section>

<section>
  <div class="head"><div><span class="small num">Characters</span><h2><span id="cc"></span> glyphs.</h2></div><p id="cp"></p></div>
  <div class="gl" id="gl"></div>
</section>

<style>#get .dl{display:inline-block;margin-bottom:6px;font-weight:700;color:inherit;text-decoration:underline;text-underline-offset:3px}</style>
<section id="get" aria-label="Get the font">
  <div><span class="small">Files</span><p id="ffiles"></p></div>
  <div><span class="small">Axes</span><p id="faxes"></p></div>
  <div><span class="small">License</span><p id="flic"></p></div>
</section>

<script>
const $=id=>document.getElementById(id);
S.load().then(D=>{
/* sound: soft synthesized press and ratchet ticks; browsers only allow audio after the visitor clicks or types */
const SND=(()=>{let ctx=null,on=true,un=false,nb=null;try{on=localStorage.getItem('tr-sound')!=='off'}catch(e){}
  const get=()=>{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;ctx=new AC()}if(ctx.state==='suspended')ctx.resume();return ctx};
  const unlock=()=>{un=true;if(on)get()};['pointerdown','keydown','touchend'].forEach(ev=>addEventListener(ev,unlock,{once:true,passive:true}));
  const noise=c=>{if(!nb){nb=c.createBuffer(1,c.sampleRate*.25|0,c.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}return nb};
  const ok=()=>on&&un&&ctx&&ctx.state==='running';let last=0,bs=null;
  const bus=c=>{if(!bs){const k=c.createDynamicsCompressor();k.threshold.value=-24;k.ratio.value=4;k.attack.value=.003;k.release.value=.2;const g=c.createGain();g.gain.value=.9;k.connect(g).connect(c.destination);bs=k}return bs};
  const burst=(c,t,type,freq,q,gain,len)=>{const n=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();n.buffer=noise(c);f.type=type;f.frequency.value=freq;f.Q.value=q;
    g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+len);n.connect(f).connect(g).connect(c.destination);n.start(t);n.stop(t+len+.01)};
  return{press(i=0){if(!ok())return;const c=ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain(),j=1+((i*37)%9-4)*.025,out=bus(c);
      /* a small click into place: a short, tight knock and a crisp tick */
      o.type='sine';o.frequency.setValueAtTime(170*j,t);o.frequency.exponentialRampToValueAtTime(80*j,t+.06);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.045,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+.09);o.connect(g).connect(out);o.start(t);o.stop(t+.1);
      burst(c,t,'bandpass',2000*j,1.2,.035,.03)},
    knob(down){if(on&&!un){un=true;get()}if(!ok())return;const c=ctx,t=c.currentTime,o=c.createOscillator(),g=c.createGain(),out=bus(c);
      /* a small switch click: higher and crisper when you pick the dot up, lower and softer when you let it go */
      const f0=down?950:520,f1=down?620:330,pk=down?.05:.035;
      o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+.025);

<style>
