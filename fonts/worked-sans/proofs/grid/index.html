<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worked Sans Weight Grid</title>
<style>
/* Layout idea: a plain proof grid. Nine weights down, five Worked settings across, one sample word per cell. */
:root{--paper:#fff;--ink:#111;--muted:#777770;--rule:#e3e3de;--tint:#f5f5f2;--gut:clamp(14px,2.6vw,40px);color-scheme:light}
@font-face{font-family:'Worked Sans';src:url('WorkedSans.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:block}
@font-face{font-family:'Worked Sans';src:url('WorkedSans-Italic.woff2') format('woff2');font-weight:100 900;font-style:italic;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink)}
body{font-family:'Worked Sans',system-ui,sans-serif;font-variation-settings:'WORK' 0;line-height:1.4}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;padding:clamp(18px,3vw,36px) var(--gut) 18px}
h1{margin:0;font-size:clamp(32px,5vw,64px);line-height:.95;font-weight:800;font-variation-settings:'WORK' 100;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--muted);font-size:15px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl input[type=text]{font:inherit;font-size:15px;border:0;border-bottom:2px solid var(--ink);padding:6px 2px;width:min(260px,60vw)}
.seg{display:flex}
.seg button{font:inherit;font-size:13px;font-weight:600;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:7px 12px;cursor:pointer}
.seg button+button{border-left:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
:focus-visible{outline:2px solid #0078bf;outline-offset:2px}
.wrap{padding:0 var(--gut) 60px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
th:first-child,td.w{width:110px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:2px solid var(--ink);position:sticky;top:0;background:var(--paper)}
th small{display:block;text-transform:none;letter-spacing:0;font-weight:400}
td{border-bottom:1px solid var(--rule);padding:10px 8px;vertical-align:middle}
td.w{width:110px;font-size:12px;color:var(--muted);white-space:nowrap}
td.w b{display:block;color:var(--ink);font-size:14px}
td.s{font-size:var(--sz,110px);line-height:1;white-space:nowrap;overflow:hidden}
tr:nth-child(even) td{background:var(--tint)}
.size{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div><h1>Worked Sans</h1><p class="sub">Every weight across the Worked scale. 80 is the default and matches Work Sans Rough. Type your own word to compare.</p></div>
  <div class="ctl">
    <label for="word" class="size">Word</label><input type="text" id="word" value="Hand" maxlength="24">
    <label class="size" for="sz">Size <input type="range" id="sz" min="28" max="180" value="110"></label>
    <div class="seg" role="group" aria-label="Style"><button id="rom" aria-pressed="true">Roman</button><button id="ita" aria-pressed="false">Italic</button></div>
  </div>
</header>
<div class="wrap"><table id="t"><thead><tr><th>Weight</th></tr></thead><tbody></tbody></table></div>
<script>
const W=[[100,'Thin'],[200,'ExtraLight'],[300,'Light'],[400,'Regular'],[500,'Medium'],[600,'SemiBold'],[700,'Bold'],[800,'ExtraBold'],[900,'Black']];
const K=[[0,'Lightly worked'],[20,''],[40,''],[60,''],[80,'Default · = Work Sans Rough'],[100,'Roughest']];
const t=document.getElementById('t'),hr=t.tHead.rows[0],tb=t.tBodies[0];
K.forEach(([k,n])=>hr.insertAdjacentHTML('beforeend',`<th>Worked ${k}${n?`<small>${n}</small>`:''}</th>`));
W.forEach(([w,n])=>{const tr=document.createElement('tr');tr.innerHTML=`<td class="w"><b>${n}</b>${w}</td>`+K.map(([k])=>`<td class="s" style="font-weight:${w};font-variation-settings:'wght' ${w}, 'WORK' ${k}"></td>`).join('');tb.appendChild(tr)});
const cells=[...document.querySelectorAll('td.s')],word=document.getElementById('word');
const fill=()=>cells.forEach(c=>c.textContent=word.value||"Hand");word.oninput=fill;fill();
const szIn=document.getElementById('sz');szIn.oninput=e=>t.style.setProperty('--sz',e.target.value+'px');
const fit=Math.max(36,Math.min(140,Math.floor((Math.max(innerWidth,760)-2*Math.min(40,innerWidth*.026)-130)/6/2.95)));szIn.value=fit;t.style.setProperty('--sz',fit+'px');
const st=i=>{document.getElementById('rom').setAttribute('aria-pressed',!i);document.getElementById('ita').setAttribute('aria-pressed',i);cells.forEach(c=>c.style.fontStyle=i?'italic':'normal')};
document.getElementById('rom').onclick=()=>st(false);document.getElementById('ita').onclick=()=>st(true);
</script>
</body>
</html>
